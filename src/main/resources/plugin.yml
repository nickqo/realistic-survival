name: RealisticSurvival
version: '${project.version}'
main: cl.nico.realisticsurvival.RealisticSurvival
api-version: '1.21'
author: nico
description: >
  Deterioro de alimentos, refrigeracion/congelacion custom y agricultura estacional realista,
  integrado con RealisticSeasons.

# Hard dependency: el servidor NO cargara este plugin si RealisticSeasons no esta presente.
depend: [RealisticSeasons]

commands:
  rsgive:
    description: Entrega electrodomesticos o herramientas de riego custom del plugin.
    usage: /<command> <fridge|freezer|wateringcan|sprinkler> [jugador]
    permission: realisticsurvival.give
  rsdebug:
    description: Fuerza la frescura/congelado del item en mano, para testear sin esperar dias in-game reales.
    usage: /<command> setfreshness <0-100> | setfrozen <true|false> | currentday | lore <true|false>
    permission: realisticsurvival.debug

permissions:
  realisticsurvival.give:
    description: Permite usar /rsgive para obtener items custom del plugin.
    default: op
  realisticsurvival.debug:
    description: Permite usar /rsdebug para forzar el estado de frescura de un item.
    default: op
